<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SĀCHU Badge AR</title>
  <link rel="icon" href="data:," />  <!-- no favicon, avoids a 404 -->
  <link rel="stylesheet" href="css/style.css?v=6" />

  <!-- Libraries, pinned to exact versions. Order matters: A-Frame first, then MindAR. -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- Our code. "defer" runs them in this order, after the page is parsed but
       before A-Frame builds the scene. app.js holds the tuning values.
       ?v=6: bump this number when these files change, so phones don't use an old cached copy. -->
  <script src="js/app.js?v=6" defer></script>
  <script src="js/camera.js?v=6" defer></script>
  <script src="js/sync.js?v=6" defer></script>
  <script src="js/video.js?v=6" defer></script>
  <script src="js/components.js?v=6" defer></script>
</head>
<body>
  <!-- 1. Start screen. Covers everything until the user taps. -->
  <div id="start-screen" class="screen">
    <h1>SĀCHU Badge AR</h1>
    <p>Point your camera at your event badge to see it come alive.</p>
    <button id="start-button" disabled>Loading…</button>
  </div>

  <!-- 2. Dark cover while the camera starts, so you never see it resizing. -->
  <div id="loading-screen" class="screen hidden">
    <div class="spinner"></div>
    <p>Starting camera…</p>
  </div>

  <!-- 3. Framing screen: shown over the camera after it starts. A badge-shaped
       outline to line the badge up with; it turns green when the badge is found.
       The button unlocks after a moment of steady tracking (app.js). -->
  <div id="framing" class="hidden">
    <p id="framing-status">Looking for your badge…</p>
    <div id="framing-outline"></div>
    <div id="framing-bottom">
      <ul id="framing-tips">
        <li>Hold the badge flat</li>
        <li>Fill the outline</li>
        <li>Good light</li>
        <li>Avoid glare</li>
      </ul>
      <button id="experience-button" disabled>Start the experience</button>
    </div>
  </div>

  <!-- 4. Hint shown while the badge isn't in view (during the experience). -->
  <div id="hint" class="hidden">Point your camera at the badge</div>

  <!-- Sound buttons (experience only). "Tap for sound" appears only if the
       phone refused to start the video with sound; the small one mutes/unmutes. -->
  <button id="sound-button" class="hidden">🔊 Tap for sound</button>
  <button id="mute-button" class="hidden" aria-label="Mute">🔊</button>

  <!-- The video shown on the badge. It's outside <a-assets> on purpose: A-Frame
       makes the whole scene wait until a preload="auto" asset is fully
       downloaded (14 MB). Not autoplay: video.js starts it from the
       "Start the experience" tap so it can play with sound. -->
  <video id="overlay-video" src="./assets/overlay.mp4" poster="./assets/overlay-poster.jpg"
         playsinline webkit-playsinline preload="auto" loop></video>

  <!-- 5. Friendly error message (camera blocked, no HTTPS, etc.). -->
  <div id="error-screen" class="screen hidden">
    <h1>Camera not available</h1>
    <p id="error-text"></p>
    <button onclick="location.reload()">Try again</button>
  </div>

  <!-- 6. Debug panel, only shown when the address ends in ?debug -->
  <div id="debug" class="hidden">
    <pre id="debug-text"></pre>
    <button id="debug-seethrough">See-through</button>
  </div>

  <!--
    The AR scene. The MindAR settings (mindar-image) are added by app.js from
    the TUNING values at its top, so all the knobs live in one place.
    renderer colorManagement: makes the photo's colors look like the original.
    xr-mode-ui: hides A-Frame's VR/AR goggles button (in A-Frame 1.5 this
      replaced the old name "vr-mode-ui" that older MindAR examples use).
  -->
  <a-scene
    renderer="colorManagement: true"
    xr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Files the scene uses. The poster (the video's first frame) shows on the
         badge until the video is actually playing; then video.js switches the
         plane to the video. -->
    <a-assets>
      <img id="overlay-poster" src="./assets/overlay-poster.jpg" />
    </a-assets>

    <!-- MindAR moves the badge entity, so the camera stays still. -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- The raw tracked badge position from MindAR. Nothing is drawn here. -->
    <a-entity id="badge-target" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- What you see. follow-badge glides this toward the raw badge position
         every frame (smooths jitter, holds through dropouts, fades in/out). -->
    <a-entity id="overlay-holder" follow-badge="target: #badge-target">
      <!-- width 1 = the badge's width. height 1.3333 = the badge's 3:4 shape
           (overlay.mp4 is cropped to 720x960 = 3:4, so it fills it exactly). -->
      <a-plane id="overlay"
               width="1" height="1.3333"
               material="shader: flat; src: #overlay-poster; transparent: true; opacity: 0"
               rounded-corners></a-plane>
    </a-entity>
  </a-scene>
</body>
</html>
